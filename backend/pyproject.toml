[project]
name = "lienrho-backend"
version = "0.1.0"
description = "LIENRHO — working-capital decision layer API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "xgboost>=3.4.1",
    "scikit-learn>=1.9.0",
    "numpy>=2.5.2",
    "langgraph>=1.2.11",
    "litellm>=1.97.0",
    "langfuse>=4.14.4",
    "langchain>=1.3.15",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
exclude = ["migrations"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection mechanism is a call in an argument
# default. B008 exists to catch mutable defaults; these are not that.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
